[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w2-pipeline"
version = "0.1.0"
description = "W-2 document-processing contracts and ingestion boundary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
external = [
    "datasets>=2,<5",
    "pandas>=2,<3",
    "pyarrow>=15,<23",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
