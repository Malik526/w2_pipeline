[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w2-pipeline"
version = "0.1.0"
description = "W-2 document-processing contracts and ingestion boundary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
external = [
    "datasets>=2,<5",
    "pandas>=2,<3",
    "pyarrow>=15,<23",
]
paddle = [
    "paddlepaddle>=3,<4",
    "paddleocr>=3,<4",
]
# GPU execution deliberately excludes a pinned `paddlepaddle-gpu` dependency
# here: NVIDIA CUDA build selection depends on the local driver version and
# GPU wheels are distributed from Paddle's own CUDA-specific package index
# (not standard PyPI), which a static pyproject dependency cannot express.
# Install `paddlepaddle-gpu` manually first (see
# docs/contracts/extraction-pipeline-a.md), then install this extra.
# `paddleocr`/`paddlex` do not declare a `paddlepaddle` dependency themselves,
# so this extra will not pull in or conflict with an already-installed GPU
# runtime.
paddle-gpu = [
    "paddleocr>=3,<4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
