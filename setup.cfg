[metadata]
name = w2-pipeline
version = 0.1.0
description = W-2 document-processing contracts and ingestion boundary.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    Pillow>=10,<13
    PyMuPDF>=1.24,<2
    pydantic>=2,<3

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8,<9
external =
    datasets>=2,<5
    pandas>=2,<3
    pyarrow>=15,<23
