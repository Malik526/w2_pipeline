[metadata]
name = w2-pipeline
version = 0.1.0
description = Canonical W-2 document-processing contracts.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    pydantic>=2,<3

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8,<9
